<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng review PR tự động</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · pr-review-agent</p>
    <h1>Luồng review PR tự động</h1>

    <svg viewBox="0 0 880 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-review-flow-title pr-review-flow-desc">
      <title id="pr-review-flow-title">Luồng review PR tự động</title>
      <desc id="pr-review-flow-desc">Flowchart cho thấy webhook pull_request từ GitHub đi qua Hermes gateway để xác thực chữ ký và chống trùng lặp theo head_sha, sau đó hook script tách một tiến trình nền chạy Claude Code review diff và đăng kết quả thành comment trên PR.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn before boxes) ============ -->
      <line x1="280" y1="80"  x2="280" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="216" x2="280" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="352" x2="280" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="456" x2="280" y2="504" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="568" x2="280" y2="616" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="680" x2="280" y2="728" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="792" x2="280" y2="840" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- reject branch A: chữ ký / event sai -->
      <path d="M 376 168 H 632 A 8 8 0 0 1 640 176 V 232" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- reject branch B: delivery trùng -->
      <path d="M 376 304 H 632 A 8 8 0 0 0 640 296 V 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS ============ -->
      <rect x="486" y="148" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">401</text>

      <rect x="486" y="284" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="293" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRÙNG</text>

      <rect x="288" y="230" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="239" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HỢP LỆ</text>

      <rect x="288" y="366" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="375" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MỚI</text>

      <rect x="288" y="474" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="292" y="483" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SETSID DETACH</text>

      <!-- ============ ANNOTATION CALLOUT ============ -->
      <text x="856" y="440" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">thoát ngay — Hermes chặn request tối đa 30s</text>
      <path d="M 600 444 Q 504 440 400 424" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="400" cy="424" r="2" fill="#2d3142"/>

      <!-- ============ NODES ============ -->
      <!-- N1 START -->
      <rect x="160" y="32" width="240" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="160" y="32" width="240" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub: mở / push PR</text>
      <text x="280" y="68" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pull_request</text>

      <!-- N2 DECISION: signature + event -->
      <polygon points="280,120 376,168 280,216 184,168" fill="#f5f5f5"/>
      <polygon points="280,120 376,168 280,216 184,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chữ ký + event OK?</text>
      <text x="280" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hermes gateway</text>

      <!-- N3 DECISION: dedupe -->
      <polygon points="280,256 376,304 280,352 184,304" fill="#f5f5f5"/>
      <polygon points="280,256 376,304 280,352 184,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sha mới?</text>
      <text x="280" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">head_sha</text>

      <!-- N4 hook script -->
      <rect x="160" y="392" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="392" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="400" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="182" y="409" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="280" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tách tiến trình nền</text>
      <text x="280" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">echo [SILENT] → 200</text>

      <!-- N5 fetch diff -->
      <rect x="160" y="504" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="504" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="512" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="182" y="521" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="280" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lấy diff, cắt bớt</text>
      <text x="280" y="560" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gh pr diff</text>

      <!-- N6 FOCAL: claude review -->
      <rect x="160" y="616" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="616" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="168" y="624" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="182" y="633" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="280" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code review</text>
      <text x="280" y="672" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude -p</text>

      <!-- N7 post comment -->
      <rect x="160" y="728" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="728" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="736" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="182" y="745" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="280" y="768" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đăng kết quả</text>
      <text x="280" y="784" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gh pr comment</text>

      <!-- N8 END -->
      <rect x="160" y="840" width="240" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="160" y="840" width="240" height="48" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="868" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Comment review trên PR</text>

      <!-- N9 REJECT END -->
      <rect x="540" y="232" width="200" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="540" y="232" width="200" height="48" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="640" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dừng, không xử lý</text>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="908" x2="848" y2="908" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="928" width="24" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="144" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BẮT ĐẦU / KẾT THÚC</text>

      <polygon points="316,926 328,934 316,942 304,934" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="336" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">QUYẾT ĐỊNH</text>

      <rect x="468" y="928" width="24" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="500" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BƯỚC</text>

      <rect x="608" y="928" width="24" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="640" y="936" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TRỌNG TÂM</text>
    </svg>
  </div>
</body>
</html>
